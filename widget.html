<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Unity Arc BillBot</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f7f7f7;
    }
    #billbot {
      width: 100%;
      max-width: 420px;
      border: 1px solid #ccc;
      border-radius: 8px;
      background: #fff;
      padding: 10px;
    }
    #messages {
      height: 300px;
      overflow-y: auto;
      border: 1px solid #ddd;
      padding: 8px;
      margin-bottom: 10px;
      font-size: 14px;
    }
    .user {
      font-weight: bold;
      margin-top: 6px;
    }
    .bot {
      margin-left: 10px;
      margin-bottom: 6px;
    }
    #inputRow {
      display: flex;
      gap: 6px;
    }
    input {
      flex: 1;
      padding: 6px;
    }
    button {
      padding: 6px 10px;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div id="billbot">
    <h3>🧾 Ask BillBot</h3>
    <div id="messages"></div>

    <div id="inputRow">
      <input id="question" placeholder="Ask about a bill or law…" />
      <button onclick="ask()">Send</button>
    </div>
  </div>

  <script>
    const API_URL = "https://unity-arc-billbot-production.up.railway.app/chat";

    const messages = document.getElementById("messages");

    function addMessage(text, cls) {
      const div = document.createElement("div");
      div.className = cls;
      div.textContent = text;
      messages.appendChild(div);
      messages.scrollTop = messages.scrollHeight;
    }

    async function ask() {
      const q = document.getElementById("question").value;
      if (!q) return;

      addMessage("You: " + q, "user");
      document.getElementById("question").value = "";

      try {
        const res = await fetch(API_URL, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ message: q, jurisdiction: "unknown", top_k: 5 })
        });
        const data = await res.json();
       if (data.needs_clarification) {
  addMessage("BillBot: " + (data.clarification_question || "I need one more detail."), "bot");
  if (data.clarification_options && data.clarification_options.length) {
    addMessage("Options: " + data.clarification_options.join(" | "), "bot");
  }
} else {
  addMessage("BillBot: " + (data.answer || "No answer returned."), "bot");
}

      } catch (e) {
        addMessage("BillBot: Sorry, something went wrong.", "bot");
      }
    }
  </script>
</body>
</html>
